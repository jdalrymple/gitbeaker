version: 2.1

# ====================
# ENVIRONMENT VARIABLES
# ====================
# Note: Custom image gitlab-ready-image-[major-version] will be created automatically if it doesn't exist
x-environment: &default_environment
  GCP_ZONE: us-central1-c
  GITLAB_VERSION: 19.2.0-ce.0
  GITLAB_MACHINE_TYPE: e2-standard-4
  GITLAB_PERSONAL_ACCESS_TOKEN: gitbeaker
  GITLAB_ROOT_PASSWORD: gitbeaker

# ====================
# EXECUTORS
# ====================
executors:
  node-executor:
    docker:
      - image: cimg/node:24.18.0
    resource_class: medium
    working_directory: ~/project

  playwright-executor:
    docker:
      - image: mcr.microsoft.com/playwright:v1.57.0-noble
    resource_class: medium
    working_directory: ~/project

  gcp-executor:
    docker:
      - image: cimg/gcp:2026.07.1
    resource_class: small
    working_directory: ~/project

# ====================
# COMMANDS
# ====================
commands:
  gcp_auth:
    description: 'Authenticate with GCP and set project'
    steps:
      - run:
          name: Authenticate with GCP
          command: |
            echo $GCLOUD_SERVICE_KEY | base64 -d | gcloud auth activate-service-account --key-file=-
            gcloud --quiet config set project ${GOOGLE_PROJECT_ID}
  setup_workspace:
    description: 'Set up workspace with dependencies and cache'
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "pnpm-lock.yaml" }}
            - v1-dependencies-
      - run:
          name: Install dependencies
          command: |
            pnpm install --frozen-lockfile
            echo "PLAYWRIGHT_VERSION=$(pnpm view @playwright/test version --json | jq -r '.')" >> $BASH_ENV
      - save_cache:
          key: v1-dependencies-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
      - persist_to_workspace:
          root: .
          paths:
            - .

  restore_workspace:
    description: 'Restore workspace from previous jobs'
    steps:
      - attach_workspace:
          at: .

  setup_nx_cache:
    description: 'Set up NX cache'
    steps:
      - restore_cache:
          keys:
            - v1-nx-cache-{{ checksum "pnpm-lock.yaml" }}
            - v1-nx-cache-
      - run:
          name: Setup NX
          command: echo "NX setup complete"

  save_nx_cache:
    description: 'Save NX cache'
    steps:
      - save_cache:
          key: v1-nx-cache-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .nx/cache

  run_package_tests:
    description: 'Run tests for a specific package'
    parameters:
      package:
        type: string
      test_type:
        type: string
    steps:
      - setup_nx_cache
      - run:
          name: Run << parameters.test_type >> tests for << parameters.package >>
          environment:
            NODE_OPTIONS: '--max-old-space-size=3584'
            JEST_MAX_WORKERS: '1'
          command: pnpm test:<< parameters.test_type >> --projects=<< parameters.package >>
          no_output_timeout: 30m
      - save_nx_cache

  setup_gitlab_vars:
    description: 'Set up GitLab-related environment variables'
    steps:
      - run:
          name: Set GitLab image variables
          command: |
            # Extract major version number from GITLAB_VERSION (e.g., 19 from 19.2.0-ce.0)
            GITLAB_MAJOR_VERSION=$(echo "${GITLAB_VERSION}" | cut -d. -f1)
            GITLAB_IMAGE_NAME="gitlab-ready-image-${GITLAB_MAJOR_VERSION}"

            # Export to BASH_ENV so they're available in subsequent steps
            echo "export GITLAB_MAJOR_VERSION=${GITLAB_MAJOR_VERSION}" >> $BASH_ENV
            echo "export GITLAB_IMAGE_NAME=${GITLAB_IMAGE_NAME}" >> $BASH_ENV

            echo "GitLab version: ${GITLAB_VERSION}"
            echo "GitLab major version: ${GITLAB_MAJOR_VERSION}"
            echo "GitLab image name: ${GITLAB_IMAGE_NAME}"

  install_pnpm_if_playwright:
    description: 'Install pnpm for Playwright executor (uses version from package.json)'
    parameters:
      executor_type:
        type: string
        description: 'Executor type to check (playwright-executor will trigger pnpm installation)'
    steps:
      - when:
          condition:
            equal: ['playwright-executor', << parameters.executor_type >>]
          steps:
            - run:
                name: Install pnpm (Playwright executor only)
                command: npm install -g pnpm@11.17.0

  load_gitlab_environment:
    description: 'Load GitLab environment variables for e2e tests'
    steps:
      - run:
          name: Load GitLab environment
          command: |
            if [ -f gitlab-env.txt ]; then
              source gitlab-env.txt
              echo "export GITLAB_URL=$GITLAB_URL" >> $BASH_ENV
              echo "export GITLAB_PERSONAL_ACCESS_TOKEN=$GITLAB_PERSONAL_ACCESS_TOKEN" >> $BASH_ENV
              echo "export CONTAINER_NAME=$CONTAINER_NAME" >> $BASH_ENV
              echo "✅ GitLab environment loaded"
            else
              echo "⚠️ No GitLab environment file found"
            fi

# ====================
# JOBS
# ====================
jobs:
  install:
    executor: node-executor
    description: 'Install project dependencies with caching'
    steps:
      - setup_workspace

  build:
    executor: node-executor
    description: 'Build all packages using NX'
    steps:
      - restore_workspace
      - setup_nx_cache
      - run:
          name: Build packages
          command: pnpm build
      - save_nx_cache
      - persist_to_workspace:
          root: .
          paths:
            - packages/*/dist

  lint:
    executor: node-executor
    description: 'Run oxlint on all packages'
    steps:
      - restore_workspace
      - setup_nx_cache
      - run:
          name: Lint code
          command: pnpm lint
      - save_nx_cache

  format:
    executor: node-executor
    description: 'Check code formatting with Prettier'
    steps:
      - restore_workspace
      - setup_nx_cache
      - run:
          name: Check formatting
          command: pnpm format
      - save_nx_cache

  # ====================
  # PARAMETERIZED TEST JOB
  # ====================
  run-package-tests:
    executor: << parameters.executor_type >>
    parameters:
      package_short:
        type: string
        description: 'Short package name (e.g., core, rest, cli, requester-utils)'
      test_type:
        type: string
        description: 'Test type (unit, types, integration, e2e)'
      executor_type:
        type: string
        default: 'node-executor'
        description: 'Executor type to use'
      requires_gitlab_env:
        type: boolean
        default: false
        description: 'Whether this test requires GitLab environment'
    steps:
      - restore_workspace
      - install_pnpm_if_playwright:
          executor_type: << parameters.executor_type >>
      - when:
          condition: << parameters.requires_gitlab_env >>
          steps:
            - load_gitlab_environment
      - run_package_tests:
          package: '@gitbeaker/<< parameters.package_short >>'
          test_type: << parameters.test_type >>

  # ====================
  # LIVE TEST SETUP
  # ====================
  setup-e2e-tests:
    executor: gcp-executor
    description: 'Create GitLab instance on GCP for e2e testing'
    environment: *default_environment
    steps:
      - checkout
      - gcp_auth
      - setup_gitlab_vars
      - run:
          name: Check and create GitLab image if needed
          command: |
            echo "Checking for required GitLab image: ${GITLAB_IMAGE_NAME}"

            # Check if the required image exists
            if gcloud compute images describe "${GITLAB_IMAGE_NAME}" --project=gitbeaker --quiet >/dev/null 2>&1; then
              echo "✅ GitLab image ${GITLAB_IMAGE_NAME} already exists"
            else
              echo "❌ GitLab image ${GITLAB_IMAGE_NAME} does not exist"
              echo "🚀 Building new GitLab image..."

              # Install packer if not available
              if ! command -v packer &> /dev/null; then
                echo "Installing Packer..."
                curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
                sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
                sudo apt-get update && sudo apt-get install packer
              fi

              # Initialize and build the image
              cd scripts
              packer init gitlab-image-19.pkr.hcl
              packer validate -var "gcp_credentials=$(echo $GCLOUD_SERVICE_KEY | base64 -d)" gitlab-image-19.pkr.hcl

              echo "Building GitLab image (this may take 5-10 minutes)..."
              packer build -var "gcp_credentials=$(echo $GCLOUD_SERVICE_KEY | base64 -d)" gitlab-image-19.pkr.hcl

              echo "✅ GitLab image ${GITLAB_IMAGE_NAME} created successfully"
            fi
      - run:
          name: Setup live GitLab instance
          command: |
            set +e  # Don't exit on errors, we handle them manually

            # Replace periods and other invalid characters with hyphens for GCP instance name
            GITLAB_VERSION_SAFE=$(echo "${GITLAB_VERSION}" | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/-$//')
            export CONTAINER_NAME=gitlab-${GITLAB_VERSION_SAFE}-${CIRCLE_BUILD_NUM}

            # Create startup script
            envsubst < scripts/startup.sh > scripts/startup_filled.sh

            # Create GCP instance with custom GitLab-ready image and auto-expiry
            echo "Creating GCP instance '$CONTAINER_NAME' using image: ${GITLAB_IMAGE_NAME}"
            GCLOUD_OUTPUT=$(gcloud compute instances create $CONTAINER_NAME \
              --project gitbeaker \
              --machine-type=$GITLAB_MACHINE_TYPE \
              --boot-disk-size=50GB \
              --boot-disk-type=pd-ssd \
              --zone=$GCP_ZONE \
              --tags http-server \
              --provisioning-model=SPOT \
              --max-run-duration=15m \
              --instance-termination-action=DELETE \
              --metadata-from-file startup-script=scripts/startup_filled.sh \
              --image=$GITLAB_IMAGE_NAME \
              --image-project=gitbeaker 2>&1)

            # Extract IP address from the created instance
            GITLAB_HOST=$(gcloud compute instances describe $CONTAINER_NAME \
              --zone=$GCP_ZONE \
              --project=gitbeaker \
              --format='get(networkInterfaces[0].accessConfigs[0].natIP)')


            if [ -z "$GITLAB_HOST" ]; then
              echo "ERROR: Failed to get IP address for instance $CONTAINER_NAME"
              exit 1
            fi

            export GITLAB_URL="http://${GITLAB_HOST}"

            # Wait for GitLab to be ready with smarter polling
            echo "Waiting for GitLab to start..."

            # Start polling earlier with exponential backoff
            attempt=1
            wait_time=30
            max_attempts=40  # ~20 minutes total with exponential backoff

            while [ $attempt -le $max_attempts ]; do
              echo "Polling attempt $attempt (waiting ${wait_time}s)..."
              sleep $wait_time

              # Check if GitLab is responding
              curl_output=""
              curl --fail --silent --max-time 10 -X GET "$GITLAB_URL/-/readiness?all=1" --insecure > /tmp/curl_output 2>&1

              curl_exit_code=$?

              if [ -f /tmp/curl_output ]; then
                curl_output=$(cat /tmp/curl_output)
              fi

              if [ $curl_exit_code -eq 0 ]; then
                readiness_response="$curl_output"

                if echo "$readiness_response" | jq -e '.master_check[0].status == "ok"' > /dev/null 2>&1; then
                  echo "GitLab is ready!"
                  break
                else
                  echo "GitLab responding but not fully ready yet..."
                fi
              else
                echo "GitLab not responding yet..."
              fi

              ((attempt++))
              # Exponential backoff: 30s, 45s, 60s, then cap at 60s
              if [ $wait_time -lt 60 ]; then
                wait_time=$((wait_time + 15))
              fi
            done

            if [ $attempt -gt $max_attempts ]; then
              echo "ERROR: GitLab failed to start within timeout (~20 minutes)"
              exit 1
            fi

            echo "GitLab is ready and operational!"

            # Create environment file for e2e tests
            echo "GITLAB_URL=$GITLAB_URL" > gitlab-env.txt
            echo "GITLAB_PERSONAL_ACCESS_TOKEN=$GITLAB_PERSONAL_ACCESS_TOKEN" >> gitlab-env.txt
            echo "CONTAINER_NAME=$CONTAINER_NAME" >> gitlab-env.txt

            # Also set for this job
            echo "export GITLAB_URL=$GITLAB_URL" >> $BASH_ENV
            echo "export GITLAB_PERSONAL_ACCESS_TOKEN=$GITLAB_PERSONAL_ACCESS_TOKEN" >> $BASH_ENV
            echo "export CONTAINER_NAME=$CONTAINER_NAME" >> $BASH_ENV
      - persist_to_workspace:
          root: .
          paths:
            - gitlab-env.txt

  # ====================
  # TEARDOWN
  # ====================

  teardown-e2e-tests:
    executor: gcp-executor
    description: 'Clean up GitLab GCP instance after e2e tests complete'
    environment: *default_environment
    steps:
      - restore_workspace
      - gcp_auth
      - run:
          when: always
          name: Cleanup GitLab GCP instance
          command: |
            # Load the container name from setup job and delete instance
            if [ -f gitlab-env.txt ]; then
              source gitlab-env.txt
              echo "Cleaning up GitLab instance: $CONTAINER_NAME"
              gcloud compute instances delete "$CONTAINER_NAME" --zone=$GCP_ZONE --quiet || true
            else
              echo "No gitlab-env.txt file found - no GitLab instance to clean up"
            fi

  # ====================
  # CLEANUP OLD IMAGES
  # ====================
  cleanup-old-gitlab-images:
    executor: gcp-executor
    description: 'Clean up old GitLab images that dont match current version (optional job)'
    environment: *default_environment
    steps:
      - checkout
      - gcp_auth
      - setup_gitlab_vars
      - run:
          name: Clean up old GitLab images
          command: |
            echo "Current GitLab version: ${GITLAB_VERSION}"
            echo "Current image name: ${GITLAB_IMAGE_NAME}"
            echo ""

            # Find all gitlab-ready-image-* images in the project
            OLD_IMAGES=$(gcloud compute images list \
              --project=gitbeaker \
              --filter="name~^gitlab-ready-image-[0-9]+$" \
              --format="value(name)" | grep -v "^${GITLAB_IMAGE_NAME}$" || true)

            if [ -z "$OLD_IMAGES" ]; then
              echo "✅ No old GitLab images found to clean up"
            else
              echo "🧹 Found old GitLab images to clean up:"
              echo "$OLD_IMAGES"
              echo ""

              # Delete each old image
              echo "$OLD_IMAGES" | while read -r image_name; do
                if [ -n "$image_name" ]; then
                  echo "🗑️  Deleting old image: $image_name"
                  gcloud compute images delete "$image_name" \
                    --project=gitbeaker \
                    --quiet || echo "❌ Failed to delete $image_name"
                fi
              done

              echo ""
              echo "✅ Cleanup completed"
            fi

            # Show remaining GitLab images
            echo ""
            echo "📋 Remaining GitLab images:"
            gcloud compute images list \
              --project=gitbeaker \
              --filter="name~^gitlab-ready-image-" \
              --format="table(name,creationTimestamp,diskSizeGb)" || echo "No GitLab images found"

  # ====================
  # CODECOV UPLOAD
  # ====================
  codecov-upload:
    executor: node-executor
    description: 'Upload coverage reports and bundle analysis to Codecov'
    steps:
      - restore_workspace
      - run:
          name: Upload coverage reports
          command: |
            # Upload coverage reports for each package that has coverage
            for coverage_file in packages/*/coverage/lcov.info; do
              if [ -f "$coverage_file" ]; then
                package=$(basename $(dirname $(dirname "$coverage_file")))
                echo "Uploading coverage for ${package}..."
                pnpm dlx @codecov/cli upload-coverage \
                  --file "$coverage_file" \
                  --flags ${package}
              fi
            done
      - run:
          name: Upload test results
          command: |
            # Upload test results for each package that has test reports
            for reports_dir in packages/*/reports; do
              if [ -d "$reports_dir" ] && [ "$(ls -A "$reports_dir"/*.xml 2>/dev/null)" ]; then
                package=$(basename $(dirname "$reports_dir"))
                echo "Uploading test results for ${package}..."
                pnpm dlx @codecov/cli upload-test-results \
                  --dir "$reports_dir"
              fi
            done
      - run:
          name: Upload bundle analysis
          command: |
            # Upload bundle analysis for each package that has built dist
            for dist_dir in packages/*/dist; do
              if [ -d "$dist_dir" ]; then
                package=$(basename $(dirname "$dist_dir"))
                echo "Uploading bundle analysis for ${package}..."
                pnpm dlx @codecov/bundle-analyzer "$dist_dir" \
                  --bundle-name=${package} \
                  --upload-token=$CODECOV_TOKEN
              fi
            done

  # ====================
  # RELEASE JOBS
  # ====================
  release-canary:
    executor: node-executor
    steps:
      - restore_workspace
      - run:
          name: Setup release environment
          command: |
            npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
            git config --global user.name "CircleCI"
            git config --global user.email "ci@circleci.com"
            git remote set-url origin https://jdalrymple:${GITHUB_TOKEN}@github.com/jdalrymple/gitbeaker.git
      - run:
          name: Check for canary release
          command: |
            export PR_NUMBER=$(echo $CIRCLE_PULL_REQUEST | sed 's/.*\/pull\///')

            pnpm release:canary

  release-pre:
    executor: node-executor
    steps:
      - restore_workspace
      - run:
          name: Setup release environment
          command: |
            npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
            git config --global user.name "CircleCI"
            git config --global user.email "ci@circleci.com"
            git remote set-url origin https://jdalrymple:${GITHUB_TOKEN}@github.com/jdalrymple/gitbeaker.git
      - run:
          name: Check for pre release
          command: |
            export PR_NUMBER=$(echo $CIRCLE_PULL_REQUEST | sed 's/.*\/pull\///')

            pnpm release:pre

  release-production:
    executor: node-executor
    steps:
      - restore_workspace
      - run:
          name: Setup release environment
          command: |
            npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
            git config --global user.name "CircleCI"
            git config --global user.email "ci@circleci.com"
            git remote set-url origin https://jdalrymple:${GITHUB_TOKEN}@github.com/jdalrymple/gitbeaker.git
            git fetch --all
            git checkout $CIRCLE_BRANCH
      - run:
          name: Release production
          command: |
            export PR_NUMBER=$(echo $CIRCLE_PULL_REQUEST | sed 's/.*\/pull\///')

            pnpm release

# ====================
# WORKFLOWS
# ====================
workflows:
  version: 2

  # Main workflow
  main:
    jobs:
      - install
      - build:
          requires: [install]

      # Quality checks
      - lint:
          requires: [install]
      - format:
          requires: [install]

      # Unit tests (matrix approach)
      - run-package-tests:
          matrix:
            parameters:
              package_short: ['requester-utils', 'core', 'rest', 'cli']
          name: test-unit-<< matrix.package_short >>
          package_short: << matrix.package_short >>
          test_type: 'unit'
          requires: [install]

      # Type tests (matrix approach)
      - run-package-tests:
          matrix:
            parameters:
              package_short: ['requester-utils', 'core', 'rest']
          name: test-types-<< matrix.package_short >>
          package_short: << matrix.package_short >>
          test_type: 'types'
          requires: [build]

      # Integration tests (matrix approach)
      - run-package-tests:
          matrix:
            parameters:
              package_short: ['rest', 'core']
              executor_type: ['playwright-executor', 'node-executor']
            exclude:
              - package_short: 'core'
                executor_type: 'playwright-executor'
              - package_short: 'rest'
                executor_type: 'node-executor'
          name: test-integration-<< matrix.package_short >>
          package_short: << matrix.package_short >>
          test_type: 'integration'
          executor_type: << matrix.executor_type >>
          requires: [build]

      # Live test setup (manual for PRs, auto for main/next)
      - setup-e2e-tests:
          requires: [build, lint, format]
          filters:
            branches:
              only: [main, next]

      - approve-e2e-tests:
          type: approval
          requires: [build, lint, format]
          filters:
            branches:
              ignore: [main, next]

      - setup-e2e-tests:
          name: setup-e2e-tests-manual
          requires: [approve-e2e-tests]
          filters:
            branches:
              ignore: [main, next]

      # E2E tests
      - run-package-tests:
          name: test-e2e-rest
          package_short: 'rest'
          test_type: 'e2e'
          executor_type: 'playwright-executor'
          requires_gitlab_env: true
          requires: [setup-e2e-tests]
          filters:
            branches:
              only: [main, next]

      - run-package-tests:
          name: test-e2e-rest-manual
          package_short: 'rest'
          test_type: 'e2e'
          executor_type: 'playwright-executor'
          requires_gitlab_env: true
          requires: [setup-e2e-tests-manual]
          filters:
            branches:
              ignore: [main, next]

      - run-package-tests:
          name: test-e2e-cli
          package_short: 'cli'
          test_type: 'e2e'
          requires_gitlab_env: true
          requires: [setup-e2e-tests]
          filters:
            branches:
              only: [main, next]
      - run-package-tests:
          name: test-e2e-cli-manual
          package_short: 'cli'
          test_type: 'e2e'
          requires_gitlab_env: true
          requires: [setup-e2e-tests-manual]
          filters:
            branches:
              ignore: [main, next]

      # Cleanup - runs on success OR failure of tests
      - teardown-e2e-tests:
          name: teardown-e2e-setup-failure
          requires:
            - setup-e2e-tests:
                - failed

      - teardown-e2e-tests:
          requires:
            - test-e2e-rest:
                - failed
                - success
            - test-e2e-cli:
                - failed
                - success
          filters:
            branches:
              only: [main, next]

      - teardown-e2e-tests:
          name: teardown-e2e-tests-manual
          requires:
            - test-e2e-rest-manual:
                - failed
                - success
            - test-e2e-cli-manual:
                - failed
                - success
          filters:
            branches:
              ignore: [main, next]

      # Codecov uploads (only on non-forked branches to avoid token access issues)
      - codecov-upload:
          requires:
            - build
            - test-unit-requester-utils
            - test-unit-core
            - test-unit-rest
            - test-unit-cli
          filters:
            branches:
              # Exclude forked PR branches which start with 'pull/'
              ignore: /^pull\/.*/

      # Releases
      - release-canary:
          requires:
            - build
            - test-unit-requester-utils
            - test-unit-core
            - test-unit-rest
            - test-unit-cli
            - test-types-requester-utils
            - test-types-core
            - test-types-rest
            - test-integration-rest
            - test-integration-core
          filters:
            branches:
              ignore: [main, next]

      - release-production:
          requires:
            - build
            - test-unit-requester-utils
            - test-unit-core
            - test-unit-rest
            - test-unit-cli
            - test-types-requester-utils
            - test-types-core
            - test-types-rest
            - test-integration-rest
            - test-integration-core
            - test-e2e-rest
            - test-e2e-cli
          filters:
            branches:
              only: [main, next]

      # Optional cleanup job (manual approval required)
      - approve-cleanup-old-images:
          type: approval
          requires: [setup-e2e-tests]
          filters:
            branches:
              only: [main, next]

      - cleanup-old-gitlab-images:
          requires: [approve-cleanup-old-images]
          filters:
            branches:
              only: [main, next]
